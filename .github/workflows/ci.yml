name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the deploy workflow run these same checks before publishing.
  workflow_call:

jobs:
  verify:
    name: Type check, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
